<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf6ff"><title>日日好｜勞安室協作展示版・主管儀表板</title><style>

{border:0;border-radius:10px;min-height:49px;background:#f7fbff;color:#34536a}.day.selected{background:#93d3f6;color:#103f61;font-weight:800}.day.has:after{content:'•';display:block;color:#ed9ab7;line-height:6px;font-size:19px}.day.blank{background:transparent}.week{font-size:12px;color:#8097a9;padding:8px 0}h3{margin:0 0 12px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #d1e2ec;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#29465a}textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hide{display:none!important}.bar{height:9px;background:#e8f0f6;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#71b6df}.notice{background:#fff8e9;border:1px solid #f2dfb7;padding:12px;border-radius:12px;font-size:13px;color:#8a6834}.empty{color:#8195a4;text-align:center;padding:20px}.small{font-size:12px}dialog{border:0;border-radius:20px;max-width:500px;width:calc(100% - 26px);padding:20px;box-shadow:0 20px 80px #233d5466}dialog::backdrop{background:#12354b77}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.app{padding-top:28px}}

:root{--navy:#173854;--blue:#318cc7;--soft:#eff8ff;--line:#dce9f3}body{background:radial-gradient(circle at 12% 0%,#d9efff 0,transparent 380px),#f0f6fb;color:var(--navy)}.app{max-width:1060px;padding-top:24px}header{background:linear-gradient(125deg,#153b60,#22628f);color:white;border-radius:22px;padding:22px 20px;box-shadow:0 12px 32px #123b601e}header .muted{color:#c3e2f4;letter-spacing:1.2px;font-weight:700}header .brand{font-size:clamp(21px,4vw,29px);letter-spacing:.4px}header select{border:1px solid #94bbd5;background:#ffffff;color:#153b60;font-weight:700;max-width:145px}.notice{margin-top:16px!important;background:#fff9eb;border-color:#efdfb5;line-height:1.65}.card{border:1px solid #dceaf3;border-radius:22px;padding:20px;box-shadow:0 7px 26px #1d507b0d}.hero{background:linear-gradient(115deg,#d5edff,#f9fdff 78%);border:1px solid #d1e8f8;padding:25px}.hero h2{font-size:clamp(24px,5vw,33px);color:#173854}.stats{gap:12px}.stat{border:1px solid #e1edf5;box-shadow:0 5px 16px #153b6009;border-radius:19px;padding:18px}.stat strong{font-size:clamp(29px,6vw,39px);line-height:1.2;color:#1b527c;margin-bottom:8px}.stat:nth-child(4){border-color:#f5d9d1;background:#fff9f7}.stat:nth-child(4) strong{color:#b95645}.stat:nth-child(3){background:#f6faff}.item{border-radius:15px;padding:16px;border-left:4px solid #91c9e9;box-shadow:0 3px 12px #214f7808}.item strong{font-size:15px}.item .muted{line-height:1.6}.tag{font-weight:700}.primary,button.primary{background:#286eaa;box-shadow:0 4px 10px #246f9d20}button.primary:hover{background:#174d7c}.secondary:hover{background:#eff8ff}.nav{box-shadow:0 -5px 22px #1738540b}.nav button.active{color:#175c91}.bar{height:11px}.bar span{background:linear-gradient(90deg,#3988c1,#73c2e7)}.dash-header{background:linear-gradient(120deg,#153b60,#2675a8);color:white;border:0}.dash-header .muted{color:#d6e9f8}.dash-title{font-size:22px;margin:0 0 7px}.dash-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:14px}.dash-kpi{padding:17px;border-radius:18px;background:white;border:1px solid #dceaf3}.dash-kpi b{font-size:30px;display:block;margin:5px 0;color:#1a527c}.dash-kpi small{color:#71899b}.dash-kpi.alert{background:#fff6f3;border-color:#f2d7ce}.dash-kpi.alert b{color:#b94f3f}.dash-section-title{display:flex;align-items:center;gap:8px}.dash-section-title:before{content:'';display:block;width:5px;height:21px;border-radius:6px;background:#4aa3d8}.metric-row{margin:16px 0}.metric-row .bar{margin-top:7px}.dash-insight{line-height:1.8;background:#eff8ff;border:1px solid #d8eafa;border-radius:14px;padding:14px;margin-top:15px}.dash-list{display:flex;flex-direction:column;gap:9px}.dash-list .item{margin-top:0}.dash-footnote{margin-top:12px;font-size:12px;color:#7891a4}.day{font-size:14px}.day:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #f1bd5c;outline-offset:2px}@media(min-width:700px){.dash-kpis{grid-template-columns:repeat(4,1fr)}.dash-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.dash-columns .card{margin-top:14px}}@media(max-width:390px){header{padding:16px 13px}header .brand{font-size:20px}.card{padding:15px}.stat{padding:14px}.nav button{font-size:11px}}
</style></head><body><div class="app"><header><div><div class="muted">MY LITTLE DAYS · SAFETY TEAM</div><div class="brand">☁️ 日日好・勞安室</div></div><select id="role" aria-label="模擬角色" style="width:135px"><option value="admin">管理員</option><option value="manager">主任／主管</option><option value="staff">承辦同仁</option><option value="viewer">唯讀成員</option></select></header><div class="notice" style="margin-top:15px">展示版使用模擬資料及本機儲存；角色切換不是真實登入，不可放入公司機密或個人資料。</div><main id="main"></main></div><nav class="nav"><div class="nav-inner"><button data-page="home" class="active">⌂<br>首頁</button><button data-page="calendar">▦<br>日曆</button><button data-page="tasks">☑<br>交辦</button><button data-page="dashboard">▥<br>儀表板</button></div></nav><dialog id="dlg"><form id="taskForm"><h3 id="formTitle">新增工作</h3><input id="editId" type="hidden"><label>工作事項</label><input id="title" required maxlength="100"><label>工作說明</label><textarea id="description" maxlength="1000"></textarea><label>日期</label><input id="date" type="date" required><label>期限</label><input id="due" type="date" required><label>承辦人</label><select id="assignee"><option value="staff">承辦同仁</option><option value="manager">主任／主管</option></select><label>優先程度</label><select id="priority"><option>一般</option><option>重要</option><option>緊急</option></select><div class="actions"><button class="primary" type="submit">儲存</button><button class="secondary" type="button" id="cancel">取消</button></div></form></dialog><dialog id="replyDlg"><form id="replyForm"><h3>更新辦理情形</h3><input type="hidden" id="replyId"><label>辦理情形</label><textarea id="replyText" required></textarea><label>工作狀態</label><select id="replyStatus"><option value="進行中">進行中</option><option value="待主管確認">待主管確認</option></select><div class="actions"><button class="primary" type="submit">提交回覆</button><button class="secondary" type="button" id="replyCancel">取消</button></div></form></dialog><script>
'use strict';const KEY='rrh_team_demo_v1';const today=new Date(),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,plus=n=>{let d=new Date(today);d.setDate(d.getDate()+n);return iso(d)};const seed=[{id:'demo1',title:'ISO 45001 現地審查準備',description:'確認文件與現場改善情形（示範）',date:plus(2),due:plus(2),assignee:'staff',priority:'重要',status:'進行中',updates:[]},{id:'demo2',title:'巡檢缺失改善追蹤',description:'回報缺失改善進度（示範）',date:plus(4),due:plus(4),assignee:'staff',priority:'一般',status:'待辦',updates:[]},{id:'demo3',title:'安委會事項彙整',description:'整理會議追蹤項目（示範）',date:plus(-2),due:plus(-1),assignee:'manager',priority:'一般',status:'待辦',updates:[]}];let tasks;try{let raw=localStorage.getItem(KEY);tasks=raw?JSON.parse(raw):structuredClone(seed);if(!Array.isArray(tasks))throw Error()}catch(e){tasks=structuredClone(seed)}let page='home',viewDate=new Date(today.getFullYear(),today.getMonth(),1),selected=iso(today);const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(tasks)),role=()=>$('#role').value,canCreate=()=>['admin','manager'].includes(role()),canManage=t=>canCreate(),canReply=t=>role()==='staff'&&t.assignee==='staff'||role()==='manager'&&t.assignee==='manager'||role()==='admin',canReview=()=>['admin','manager'].includes(role()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=s=>s||'—';function status(t){return t.status!=='已完成'&&t.due<iso(today)?'逾期':t.status}function item(t){let st=status(t),act='';if(canReply(t)&&!['已完成','待主管確認'].includes(t.status))act+=`<button class="secondary" data-reply="${esc(t.id)}">回覆進度</button>`;if(canReview()&&t.status==='待主管確認')act+=`<button class="primary" data-review="${esc(t.id)}">確認結案</button><button class="secondary" data-return="${esc(t.id)}">退回辦理</button>`;if(canManage(t))act+=`<button class="secondary" data-edit="${esc(t.id)}">編輯</button><button class="secondary" data-delete="${esc(t.id)}">刪除</button>`;return `<div class="item"><div class="row"><strong>${esc(t.title)}</strong><span class="tag ${st==='逾期'?'overdue':st==='已完成'?'done':''}">${st}</span></div><div class="muted">日期 ${esc(t.date)} · 期限 ${esc(t.due)} · ${t.assignee==='staff'?'承辦同仁':'主任／主管'} · ${esc(t.priority)}</div><p class="small">${esc(t.description)}</p>${t.updates?.length?`<div class="muted">最新回覆：${esc(t.updates.at(-1).text)}</div>`:''}<div class="actions">${act}</div></div>`}function render(){let total=tasks.length,done=tasks.filter(t=>t.status==='已完成').length,waiting=tasks.filter(t=>t.status==='待主管確認').length,overdue=tasks.filter(t=>status(t)==='逾期').length;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='home'){html=`<section class="card hero"><div class="muted">歡迎使用團隊工作空間</div><h2>工作清楚，日日都好 ☀️</h2><div>先把每一件事，照顧得剛剛好。</div></section><div class="stats">${[['全部工作',total],['待辦／進行中',tasks.filter(t=>['待辦','進行中'].includes(t.status)).length],['待主管確認',waiting],['逾期',overdue]].map(a=>`<div class="stat"><strong>${a[1]}</strong><span class="muted">${a[0]}</span></div>`).join('')}</div><section class="card"><div class="row"><h3>近期工作</h3>${canCreate()?'<button class="primary" data-new>＋ 新增交辦</button>':''}</div>${tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5).map(item).join('')||'<div class="empty">尚無工作事項</div>'}</section>`}if(page==='tasks'){html=`<section class="card"><div class="row"><h3>交辦中心</h3>${canCreate()?'<button class="primary" data-new>＋ 新增交辦</button>':''}</div><div class="muted">依期限排序；所有資料僅為本機展示。</div>${tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(item).join('')||'<div class="empty">尚無工作事項</div>'}</section>`}if(page==='calendar'){let year=viewDate.getFullYear(),month=viewDate.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();html=`<section class="card"><div class="row"><button class="secondary" data-prev>‹ 上月</button><h3>${year} 年 ${month+1} 月</h3><button class="secondary" data-next>下月 ›</button></div><div class="grid">${'日一二三四五六'.split('').map(d=>`<div class="week">${d}</div>`).join('')}${Array.from({length:first},()=>'<div class="day blank"></div>').join('')}${Array.from({length:days},(_,i)=>{let d=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="day ${selected===d?'selected':''} ${tasks.some(t=>t.date===d)?'has':''}" data-date="${d}">${i+1}</button>`}).join('')}</div></section><section class="card"><div class="row"><h3>${selected}・工作事項</h3>${canCreate()?'<button class="primary" data-new>＋ 新增</button>':''}</div>${tasks.filter(t=>t.date===selected).map(item).join('')||'<div class="empty">當日尚無工作</div>'}</section>`}if(page==='dashboard'){let stats=['待辦','進行中','待主管確認','已完成'].map(s=>[s,tasks.filter(t=>t.status===s).length]);let active=tasks.filter(t=>['待辦','進行中'].includes(t.status)).length;let urgent=tasks.filter(t=>t.priority==='緊急'&&t.status!=='已完成').length;let completion=total?Math.round(done/total*100):0;let overdueItems=tasks.filter(t=>status(t)==='逾期').sort((a,b)=>a.due.localeCompare(b.due));let waitingItems=tasks.filter(t=>t.status==='待主管確認');let insight=overdue?`目前有 ${overdue} 件逾期工作，建議優先追蹤承辦進度。`:waiting?`目前有 ${waiting} 件等待主管確認，可優先辦理結案審核。`:'目前沒有逾期案件，請持續掌握近期交辦進度。';html=`<section class="card dash-header"><div class="muted">SAFETY OFFICE · MANAGEMENT OVERVIEW</div><h2 class="dash-title">勞安室｜主管管理儀表板</h2><div>工作進度、風險提醒與交辦成果，一頁掌握。</div><div class="muted" style="margin-top:9px">資料來源：本機展示資料｜角色：${esc($('#role').selectedOptions[0].textContent)}</div></section><div class="dash-kpis"><div class="dash-kpi"><small>全部工作</small><b>${total}</b><small>團隊工作總量</small></div><div class="dash-kpi"><small>進行中／待辦</small><b>${active}</b><small>持續追蹤</small></div><div class="dash-kpi"><small>待主管確認</small><b>${waiting}</b><small>待審核結案</small></div><div class="dash-kpi alert"><small>逾期未完成</small><b>${overdue}</b><small>優先處理</small></div></div><div class="dash-columns"><section class="card"><h3 class="dash-section-title">整體完成進度</h3><div class="row"><span class="muted">已完成 ${done} / ${total} 件</span><strong style="font-size:24px;color:#226b9f">${completion}%</strong></div><div class="bar" style="margin-top:10px;height:14px"><span style="width:${completion}%"></span></div><div class="dash-insight"><strong>主管重點提醒</strong><div>${insight}</div>${urgent?`<div>另有 ${urgent} 件緊急優先事項尚未結案。</div>`:''}</div><div class="dash-footnote">完成率＝已完成件數 ÷ 全部工作件數</div></section><section class="card"><h3 class="dash-section-title">工作狀態分布</h3>${stats.map(([s,n])=>`<div class="metric-row"><div class="row"><span>${s}</span><strong>${n} 件</strong></div><div class="bar"><span style="width:${total?n/total*100:0}%"></span></div></div>`).join('')||'<div class="empty">尚無工作</div>'}</section></div><div class="dash-columns"><section class="card"><h3 class="dash-section-title">逾期案件追蹤（${overdue}）</h3><div class="dash-list">${overdueItems.map(item).join('')||'<div class="empty">目前沒有逾期案件 ✓</div>'}</div></section><section class="card"><h3 class="dash-section-title">待主管確認（${waiting}）</h3><div class="dash-list">${waitingItems.map(item).join('')||'<div class="empty">目前沒有待確認案件</div>'}</div></section></div><div class="dash-footnote">※ 這是模擬角色及本機儲存的展示版，非正式權限控管或跨裝置同步系統。</div>`}$('#main').innerHTML=html}function openForm(t){$('#taskForm').reset();$('#editId').value=t?.id||'';$('#formTitle').textContent=t?'編輯工作':'新增工作';$('#title').value=t?.title||'';$('#description').value=t?.description||'';$('#date').value=t?.date||selected;$('#due').value=t?.due||selected;$('#assignee').value=t?.assignee||'staff';$('#priority').value=t?.priority||'一般';$('#dlg').showModal()}document.querySelector('.nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});$('#role').addEventListener('change',render);$('#cancel').onclick=()=>$('#dlg').close();$('#replyCancel').onclick=()=>$('#replyDlg').close();$('#main').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if('prev'in d||'next'in d){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+('next'in d?1:-1),1);selected=iso(viewDate);render()}else if(d.date){selected=d.date;render()}else if('new'in d){if(canCreate())openForm()}else if(d.edit){let t=tasks.find(x=>x.id===d.edit);if(t&&canManage(t))openForm(t)}else if(d.delete){let t=tasks.find(x=>x.id===d.delete);if(t&&canManage(t)&&confirm('確定刪除這筆展示工作？')){tasks=tasks.filter(x=>x.id!==t.id);save();render()}}else if(d.reply){let t=tasks.find(x=>x.id===d.reply);if(t&&canReply(t)){ $('#replyId').value=t.id;$('#replyText').value='';$('#replyStatus').value='進行中';$('#replyDlg').showModal()}}else if(d.review||d.return){let t=tasks.find(x=>x.id===(d.review||d.return));if(t&&canReview()&&t.status==='待主管確認'){t.status=d.review?'已完成':'進行中';t.updates.push({text:d.review?'主管確認結案':'主管退回辦理',at:new Date().toISOString(),by:role()});save();render()}}});$('#taskForm').onsubmit=e=>{e.preventDefault();if(!canCreate())return;let id=$('#editId').value,t=tasks.find(x=>x.id===id),data={title:$('#title').value.trim(),description:$('#description').value.trim(),date:$('#date').value,due:$('#due').value,assignee:$('#assignee').value,priority:$('#priority').value};if(!data.title||!data.date||!data.due)return;if(t)Object.assign(t,data);else tasks.push({id:'t'+Date.now(),...data,status:'待辦',updates:[]});save();$('#dlg').close();render()};$('#replyForm').onsubmit=e=>{e.preventDefault();let t=tasks.find(x=>x.id===$('#replyId').value);if(!t||!canReply(t)||['已完成','待主管確認'].includes(t.status))return;t.status=$('#replyStatus').value;t.updates??=[];t.updates.push({text:$('#replyText').value.trim(),at:new Date().toISOString(),by:role()});save();$('#replyDlg').close();render()};render();
</script></body></html>
