<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf6ff"><title>日日好｜勞安室協作展示版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#233d54;background:#edf7ff}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;min-height:100vh;padding:18px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#71899b;font-size:13px}.brand{font-weight:800;font-size:23px}.pill{border:1px solid #cfe2ee;background:white;border-radius:99px;padding:9px 12px;color:#31516a}.card{background:#fff;border:1px solid #e1edf5;border-radius:18px;padding:17px;margin-top:14px;box-shadow:0 5px 20px #5c96bd12}.hero{background:linear-gradient(125deg,#d8f0ff,#fff);padding:22px}.hero h2{margin:7px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.stat{background:#fff;border-radius:14px;padding:16px}.stat strong{display:block;font-size:29px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#ffffffee;border-top:1px solid #dcebf3;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav-inner{display:flex;width:min(900px,100%);justify-content:space-around}.nav button{background:none;border:0;color:#617f96;font-size:12px;padding:8px;cursor:pointer}.nav button.active{color:#247db5;font-weight:800}button{cursor:pointer}button.primary{border:0;background:#368ec4;color:white;border-radius:12px;padding:12px 16px;font-weight:700}button.secondary{border:1px solid #d0e3ef;background:white;border-radius:12px;padding:10px;color:#31516a}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{border:1px solid #e0edf4;border-radius:13px;padding:13px;margin-top:9px;background:#fff}.item strong{display:block;margin-bottom:5px}.tag{font-size:12px;border-radius:20px;background:#eaf5ff;color:#337aa7;padding:4px 9px;white-space:nowrap}.overdue{background:#fff0ed;color:#bc5c48}.done{background:#e7f6eb;color:#347f50}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.day{border:0;border-radius:10px;min-height:49px;background:#f7fbff;color:#34536a}.day.selected{background:#93d3f6;color:#103f61;font-weight:800}.day.has:after{content:'•';display:block;color:#ed9ab7;line-height:6px;font-size:19px}.day.blank{background:transparent}.week{font-size:12px;color:#8097a9;padding:8px 0}h3{margin:0 0 12px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #d1e2ec;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#29465a}textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hide{display:none!important}.bar{height:9px;background:#e8f0f6;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#71b6df}.notice{background:#fff8e9;border:1px solid #f2dfb7;padding:12px;border-radius:12px;font-size:13px;color:#8a6834}.empty{color:#8195a4;text-align:center;padding:20px}.small{font-size:12px}dialog{border:0;border-radius:20px;max-width:500px;width:calc(100% - 26px);padding:20px;box-shadow:0 20px 80px #233d5466}dialog::backdrop{background:#12354b77}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.app{padding-top:28px}}
</style></head><body><div class="app"><header><div><div class="muted">MY LITTLE DAYS · SAFETY TEAM</div><div class="brand">☁️ 日日好・勞安室</div></div><select id="role" aria-label="模擬角色" style="width:135px"><option value="admin">管理員</option><option value="manager">主任／主管</option><option value="staff">承辦同仁</option><option value="viewer">唯讀成員</option></select></header><div class="notice" style="margin-top:15px">展示版使用模擬資料及本機儲存；角色切換不是真實登入，不可放入公司機密或個人資料。</div><main id="main"></main></div><nav class="nav"><div class="nav-inner"><button data-page="home" class="active">⌂<br>首頁</button><button data-page="calendar">▦<br>日曆</button><button data-page="tasks">☑<br>交辦</button><button data-page="dashboard">▥<br>儀表板</button></div></nav><dialog id="dlg"><form id="taskForm"><h3 id="formTitle">新增工作</h3><input id="editId" type="hidden"><label>工作事項</label><input id="title" required maxlength="100"><label>工作說明</label><textarea id="description" maxlength="1000"></textarea><label>日期</label><input id="date" type="date" required><label>期限</label><input id="due" type="date" required><label>承辦人</label><select id="assignee"><option value="staff">承辦同仁</option><option value="manager">主任／主管</option></select><label>優先程度</label><select id="priority"><option>一般</option><option>重要</option><option>緊急</option></select><div class="actions"><button class="primary" type="submit">儲存</button><button class="secondary" type="button" id="cancel">取消</button></div></form></dialog><dialog id="replyDlg"><form id="replyForm"><h3>更新辦理情形</h3><input type="hidden" id="replyId"><label>辦理情形</label><textarea id="replyText" required></textarea><label>工作狀態</label><select id="replyStatus"><option value="進行中">進行中</option><option value="待主管確認">待主管確認</option></select><div class="actions"><button class="primary" type="submit">提交回覆</button><button class="secondary" type="button" id="replyCancel">取消</button></div></form></dialog><script>
'use strict';const KEY='rrh_team_demo_v1';const today=new Date(),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,plus=n=>{let d=new Date(today);d.setDate(d.getDate()+n);return iso(d)};const seed=[{id:'demo1',title:'ISO 45001 現地審查準備',description:'確認文件與現場改善情形（示範）',date:plus(2),due:plus(2),assignee:'staff',priority:'重要',status:'進行中',updates:[]},{id:'demo2',title:'巡檢缺失改善追蹤',description:'回報缺失改善進度（示範）',date:plus(4),due:plus(4),assignee:'staff',priority:'一般',status:'待辦',updates:[]},{id:'demo3',title:'安委會事項彙整',description:'整理會議追蹤項目（示範）',date:plus(-2),due:plus(-1),assignee:'manager',priority:'一般',status:'待辦',updates:[]}];let tasks;try{let raw=localStorage.getItem(KEY);tasks=raw?JSON.parse(raw):structuredClone(seed);if(!Array.isArray(tasks))throw Error()}catch(e){tasks=structuredClone(seed)}let page='home',viewDate=new Date(today.getFullYear(),today.getMonth(),1),selected=iso(today);const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(tasks)),role=()=>$('#role').value,canCreate=()=>['admin','manager'].includes(role()),canManage=t=>canCreate(),canReply=t=>role()==='staff'&&t.assignee==='staff'||role()==='manager'&&t.assignee==='manager'||role()==='admin',canReview=()=>['admin','manager'].includes(role()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=s=>s||'—';function status(t){return t.status!=='已完成'&&t.due<iso(today)?'逾期':t.status}function item(t){let st=status(t),act='';if(canReply(t)&&!['已完成','待主管確認'].includes(t.status))act+=`<button class="secondary" data-reply="${esc(t.id)}">回覆進度</button>`;if(canReview()&&t.status==='待主管確認')act+=`<button class="primary" data-review="${esc(t.id)}">確認結案</button><button class="secondary" data-return="${esc(t.id)}">退回辦理</button>`;if(canManage(t))act+=`<button class="secondary" data-edit="${esc(t.id)}">編輯</button><button class="secondary" data-delete="${esc(t.id)}">刪除</button>`;return `<div class="item"><div class="row"><strong>${esc(t.title)}</strong><span class="tag ${st==='逾期'?'overdue':st==='已完成'?'done':''}">${st}</span></div><div class="muted">日期 ${esc(t.date)} · 期限 ${esc(t.due)} · ${t.assignee==='staff'?'承辦同仁':'主任／主管'} · ${esc(t.priority)}</div><p class="small">${esc(t.description)}</p>${t.updates?.length?`<div class="muted">最新回覆：${esc(t.updates.at(-1).text)}</div>`:''}<div class="actions">${act}</div></div>`}function render(){let total=tasks.length,done=tasks.filter(t=>t.status==='已完成').length,waiting=tasks.filter(t=>t.status==='待主管確認').length,overdue=tasks.filter(t=>status(t)==='逾期').length;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='home'){html=`<section class="card hero"><div class="muted">歡迎使用團隊工作空間</div><h2>工作清楚，日日都好 ☀️</h2><div>先把每一件事，照顧得剛剛好。</div></section><div class="stats">${[['全部工作',total],['待辦／進行中',tasks.filter(t=>['待辦','進行中'].includes(t.status)).length],['待主管確認',waiting],['逾期',overdue]].map(a=>`<div class="stat"><strong>${a[1]}</strong><span class="muted">${a[0]}</span></div>`).join('')}</div><section class="card"><div class="row"><h3>近期工作</h3>${canCreate()?'<button class="primary" data-new>＋ 新增交辦</button>':''}</div>${tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5).map(item).join('')||'<div class="empty">尚無工作事項</div>'}</section>`}if(page==='tasks'){html=`<section class="card"><div class="row"><h3>交辦中心</h3>${canCreate()?'<button class="primary" data-new>＋ 新增交辦</button>':''}</div><div class="muted">依期限排序；所有資料僅為本機展示。</div>${tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(item).join('')||'<div class="empty">尚無工作事項</div>'}</section>`}if(page==='calendar'){let year=viewDate.getFullYear(),month=viewDate.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();html=`<section class="card"><div class="row"><button class="secondary" data-prev>‹ 上月</button><h3>${year} 年 ${month+1} 月</h3><button class="secondary" data-next>下月 ›</button></div><div class="grid">${'日一二三四五六'.split('').map(d=>`<div class="week">${d}</div>`).join('')}${Array.from({length:first},()=>'<div class="day blank"></div>').join('')}${Array.from({length:days},(_,i)=>{let d=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="day ${selected===d?'selected':''} ${tasks.some(t=>t.date===d)?'has':''}" data-date="${d}">${i+1}</button>`}).join('')}</div></section><section class="card"><div class="row"><h3>${selected}・工作事項</h3>${canCreate()?'<button class="primary" data-new>＋ 新增</button>':''}</div>${tasks.filter(t=>t.date===selected).map(item).join('')||'<div class="empty">當日尚無工作</div>'}</section>`}if(page==='dashboard'){let stats=['待辦','進行中','待主管確認','已完成'].map(s=>[s,tasks.filter(t=>t.status===s).length]);html=`<section class="card"><h3>工作管理儀表板</h3><div class="muted">工作總數 ${total} · 已完成 ${done} · 逾期 ${overdue}</div><h3 style="margin-top:20px">完成率 ${total?Math.round(done/total*100):0}%</h3><div class="bar"><span style="width:${total?done/total*100:0}%"></span></div>${stats.map(([s,n])=>`<div style="margin-top:19px"><div class="row"><span>${s}</span><strong>${n}</strong></div><div class="bar"><span style="width:${total?n/total*100:0}%"></span></div></div>`).join('')}</section><section class="card"><h3>逾期追蹤</h3>${tasks.filter(t=>status(t)==='逾期').map(item).join('')||'<div class="empty">目前沒有逾期事項</div>'}</section>`}$('#main').innerHTML=html}function openForm(t){$('#taskForm').reset();$('#editId').value=t?.id||'';$('#formTitle').textContent=t?'編輯工作':'新增工作';$('#title').value=t?.title||'';$('#description').value=t?.description||'';$('#date').value=t?.date||selected;$('#due').value=t?.due||selected;$('#assignee').value=t?.assignee||'staff';$('#priority').value=t?.priority||'一般';$('#dlg').showModal()}document.querySelector('.nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});$('#role').addEventListener('change',render);$('#cancel').onclick=()=>$('#dlg').close();$('#replyCancel').onclick=()=>$('#replyDlg').close();$('#main').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if('prev'in d||'next'in d){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+('next'in d?1:-1),1);selected=iso(viewDate);render()}else if(d.date){selected=d.date;render()}else if('new'in d){if(canCreate())openForm()}else if(d.edit){let t=tasks.find(x=>x.id===d.edit);if(t&&canManage(t))openForm(t)}else if(d.delete){let t=tasks.find(x=>x.id===d.delete);if(t&&canManage(t)&&confirm('確定刪除這筆展示工作？')){tasks=tasks.filter(x=>x.id!==t.id);save();render()}}else if(d.reply){let t=tasks.find(x=>x.id===d.reply);if(t&&canReply(t)){ $('#replyId').value=t.id;$('#replyText').value='';$('#replyStatus').value='進行中';$('#replyDlg').showModal()}}else if(d.review||d.return){let t=tasks.find(x=>x.id===(d.review||d.return));if(t&&canReview()&&t.status==='待主管確認'){t.status=d.review?'已完成':'進行中';t.updates.push({text:d.review?'主管確認結案':'主管退回辦理',at:new Date().toISOString(),by:role()});save();render()}}});$('#taskForm').onsubmit=e=>{e.preventDefault();if(!canCreate())return;let id=$('#editId').value,t=tasks.find(x=>x.id===id),data={title:$('#title').value.trim(),description:$('#description').value.trim(),date:$('#date').value,due:$('#due').value,assignee:$('#assignee').value,priority:$('#priority').value};if(!data.title||!data.date||!data.due)return;if(t)Object.assign(t,data);else tasks.push({id:'t'+Date.now(),...data,status:'待辦',updates:[]});save();$('#dlg').close();render()};$('#replyForm').onsubmit=e=>{e.preventDefault();let t=tasks.find(x=>x.id===$('#replyId').value);if(!t||!canReply(t)||['已完成','待主管確認'].includes(t.status))return;t.status=$('#replyStatus').value;t.updates??=[];t.updates.push({text:$('#replyText').value.trim(),at:new Date().toISOString(),by:role()});save();$('#replyDlg').close();render()};render();
</script></body></html>
